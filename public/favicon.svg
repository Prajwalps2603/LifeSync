<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4343D5"/>
      <stop offset="100%" stop-color="#7C6EF7"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Connection lines (drawn first, behind nodes) -->
  <!-- Center → top-left -->
  <line x1="16" y1="16" x2="9.5" y2="9"   stroke="white" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- Center → top-right -->
  <line x1="16" y1="16" x2="23"  y2="10"  stroke="white" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- Center → right -->
  <line x1="16" y1="16" x2="25"  y2="17"  stroke="white" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- Center → bottom-left -->
  <line x1="16" y1="16" x2="8.5" y2="22"  stroke="white" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- Center → bottom-right -->
  <line x1="16" y1="16" x2="22"  y2="24"  stroke="white" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- Satellite nodes -->
  <circle cx="9.5"  cy="9"  r="2.6" fill="white" opacity="0.85"/>
  <circle cx="23"   cy="10" r="2.2" fill="white" opacity="0.80"/>
  <circle cx="25"   cy="17" r="1.9" fill="white" opacity="0.75"/>
  <circle cx="8.5"  cy="22" r="2.2" fill="white" opacity="0.80"/>
  <circle cx="22"   cy="24" r="2.6" fill="white" opacity="0.85"/>

  <!-- Center hub node (brightest, largest) -->
  <circle cx="16" cy="16" r="3.6" fill="white"/>
</svg>
